name: Package and publish

# OpenChamber installs an extension from its Git repository, so the release
# asset is a convenience: a zip of the runtime files plus its sha256.
#
# Runs after a successful CI run on main. CI creates the v{version} tag and
# release only when package.json's version was bumped, so a run without a
# release just publishes the workflow artifact.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-publish
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Only @openchamber/sdk is needed to build the bundle.
      - name: Install
        run: bun install --production --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check the committed bundle is current
        run: git diff --exit-code -- panel/main.js

      - name: Read the version
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Look for the matching release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Publishing to release $TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release $TAG yet (version not bumped); packaging the artifact only."
          fi

      - name: Package
        run: bun run package

      - name: Attach the package to the release
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.value }}
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: openchamber-youtrack-extension-${{ steps.version.outputs.value }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
