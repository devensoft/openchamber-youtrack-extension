<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTrack projects — OpenChamber</title>
    <style>
      :root {
        color-scheme: light dark;
        /* The host publishes the app's corner radius with the rest of the
           theme. Controls sit two steps below it, like the UI kit. */
        --panel-radius: var(--radius, var(--oc-radius, 9px));
        --panel-control-radius: calc(var(--panel-radius) - 2px);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: var(--oc-bg, transparent);
        color: var(--oc-fg, inherit);
        font-family: var(--oc-font, system-ui, sans-serif);
        font-size: 13px;
        line-height: 1.45;
        overflow: hidden;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }

      .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }

      .page {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 880px;
        margin: 0 auto;
        padding: 24px 28px 20px;
      }

      .page-header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: var(--oc-muted, inherit);
        font-size: 12px;
      }

      p {
        margin: 0;
      }

      .banner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--oc-border, currentColor);
        border-radius: 8px;
        background: var(--oc-elevated, transparent);
        font-size: 12px;
      }

      .banner.error {
        border-color: var(--oc-error, #c92a2a);
        /* `--oc-error` is the solid fill; text on a neutral surface takes the
           host's computed `error-text` tone. */
        color: var(--oc-error-text, var(--oc-error, #c92a2a));
      }

      .banner.info {
        border-color: var(--oc-info, currentColor);
      }

      .banner-action {
        margin-left: auto;
        padding: 3px 9px;
        font-size: 11px;
        color: var(--oc-fg, inherit);
      }

      .state-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 20px;
        border: 1px dashed var(--oc-border, currentColor);
        border-radius: 10px;
        background: var(--oc-muted-surface, transparent);
        color: var(--oc-muted, inherit);
        font-size: 12px;
      }

      .toolbar-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--oc-border, currentColor);
        border-radius: 10px;
        background: var(--oc-muted-surface, transparent);
      }

      .search-wrap {
        position: relative;
        flex: 1 1 240px;
        min-width: 180px;
      }

      .search-icon {
        position: absolute;
        top: 50%;
        left: 10px;
        width: 14px;
        height: 14px;
        transform: translateY(-50%);
        color: var(--oc-muted, inherit);
        pointer-events: none;
      }

      .search {
        width: 100%;
        padding: 8px 10px 8px 32px;
        border: 1px solid var(--oc-border, currentColor);
        border-radius: var(--panel-control-radius);
        background: var(--oc-bg, transparent);
        color: var(--oc-fg, inherit);
        font: inherit;
      }

      .search::placeholder {
        color: var(--oc-muted, inherit);
      }

      .search:focus {
        outline: 2px solid var(--oc-focus, var(--oc-primary, currentColor));
        outline-offset: 1px;
      }

      .toolbar-actions {
        display: flex;
        flex-shrink: 0;
        gap: 6px;
      }

      .toolbar-actions button {
        padding: 6px 10px;
        font-size: 12px;
      }

      .access-summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .summary-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid var(--oc-border, currentColor);
        border-radius: 999px;
        background: var(--oc-elevated, transparent);
        color: var(--oc-muted, inherit);
        font-size: 11px;
      }

      .summary-pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        flex-shrink: 0;
      }

      .summary-pill[data-access="edit"] .dot {
        background: var(--oc-success, #2f9e44);
      }

      .summary-pill[data-access="read"] .dot {
        background: var(--oc-info, #1971c2);
      }

      .summary-count {
        color: var(--oc-fg, inherit);
        font-weight: 600;
      }

      .access-caveat {
        margin-left: auto;
        color: var(--oc-muted, inherit);
        font-size: 11px;
      }

      .groups {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .group-card {
        border: 1px solid var(--oc-border, currentColor);
        border-radius: 10px;
        background: var(--oc-muted-surface, transparent);
        overflow: hidden;
      }

      .group-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--oc-border, currentColor);
        border-left: 3px solid transparent;
      }

      .group-head .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--oc-muted, currentColor);
        flex-shrink: 0;
      }

      .group-card[data-access="edit"] .group-head {
        border-left-color: var(--oc-success, #2f9e44);
      }

      .group-card[data-access="read"] .group-head {
        border-left-color: var(--oc-info, #1971c2);
      }

      .group-card[data-access="edit"] .group-head .dot {
        background: var(--oc-success, #2f9e44);
      }

      .group-card[data-access="read"] .group-head .dot {
        background: var(--oc-info, #1971c2);
      }

      .group-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--oc-muted, inherit);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .group-count {
        padding: 0 7px;
        border-radius: 999px;
        background: var(--oc-bg, transparent);
        color: var(--oc-muted, inherit);
        font-size: 10px;
        font-weight: 500;
        line-height: 16px;
      }

      .tiles {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 12px 12px;
      }

      .project {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 9px 11px;
        border: 1px solid var(--oc-border, currentColor);
        border-radius: 8px;
        background: var(--oc-bg, transparent);
        color: var(--oc-fg, inherit);
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      .project:hover {
        background: var(--oc-hover, transparent);
      }

      .project:has(input:checked) {
        border-color: var(--oc-primary, currentColor);
        background: var(--oc-selection, var(--oc-hover, transparent));
        color: var(--oc-selection-fg, inherit);
      }

      .project input {
        margin: 0;
        accent-color: var(--oc-primary, currentColor);
      }

      .project .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }

      .project .key {
        flex-shrink: 0;
        padding: 1px 6px;
        border: 1px solid var(--oc-border, currentColor);
        border-radius: 999px;
        background: var(--oc-elevated, transparent);
        color: var(--oc-muted, inherit);
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 10px;
      }

      .project:has(input:checked) .key {
        background: var(--oc-bg, transparent);
        color: var(--oc-muted, inherit);
      }

      .footer {
        flex-shrink: 0;
        border-top: 1px solid var(--oc-border, currentColor);
        background: var(--oc-bg, transparent);
      }

      .footer-inner {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 880px;
        margin: 0 auto;
        padding: 12px 28px;
      }

      .footer-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .footer-summary {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .footer-count {
        color: var(--oc-muted, inherit);
        font-size: 12px;
      }

      .footer-unsaved {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--oc-warning-text, var(--oc-warning, #b45309));
        font-size: 11px;
      }

      .footer-unsaved .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--oc-warning, #b45309);
      }

      .footer-actions {
        display: flex;
        flex-shrink: 0;
        gap: 8px;
      }

      .footer-account {
        color: var(--oc-muted, inherit);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      button {
        padding: 6px 11px;
        border: 1px solid var(--oc-border, currentColor);
        border-radius: var(--panel-control-radius);
        background: var(--oc-elevated, transparent);
        color: var(--oc-fg, inherit);
        font: inherit;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      button:hover:enabled {
        background: var(--oc-hover, transparent);
      }

      button.primary {
        border-color: var(--oc-primary, currentColor);
        background: var(--oc-primary, currentColor);
        color: var(--oc-primary-fg, #fff);
      }

      button.primary:hover:enabled {
        background: var(--oc-primary, currentColor);
        filter: brightness(1.08);
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      button.primary:disabled {
        border-color: var(--oc-border, currentColor);
        background: var(--oc-elevated, transparent);
        color: var(--oc-muted, inherit);
      }

      @media (min-width: 720px) {
        .tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .page {
          padding: 16px;
        }

        .footer-inner {
          padding: 12px 16px;
        }

        .title-row h1 {
          font-size: 18px;
        }

        .toolbar-card {
          padding: 8px;
        }

        .access-caveat {
          margin-left: 0;
          flex-basis: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
